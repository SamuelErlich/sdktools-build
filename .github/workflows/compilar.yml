# SDKtools 3.12 US: substitua o ZIP e este workflow juntos; inicie uma NOVA execução.
# O IPA original não faz parte dos fontes. Coloque-o em uma Release privada ou
# configure um link HTTPS direto no secret SDKTOOLS_BASE_IPA_URL.
name: Compilar SDKtools US

on:
  workflow_dispatch:
    inputs:
      base_source:
        description: Onde está o IPA base original
        required: true
        default: release
        type: choice
        options:
          - release
          - secret_url
      release_tag:
        description: Tag da Release que contém WePlay_US_6.6.2_base.ipa
        required: true
        default: base-us-6.6.2
        type: string

permissions:
  contents: read

concurrency:
  group: sdktools-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Baixar fontes do repositório
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Conferir e abrir fontes SDKtools 3.12 US
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, stat, unicodedata, zipfile
          source = Path('SDKtools_Fontes.zip')
          if not source.is_file() or source.is_symlink():
              raise SystemExit('Envie SDKtools_Fontes.zip para a raiz do repositório, sem extrair.')
          if source.stat().st_size != int('792993') or hashlib.sha256(source.read_bytes()).hexdigest() != 'e9f5c826643a888e94880f0e96eeb1ffb0ed66f8116f9699fdf9b549a210ab5f':
              raise SystemExit('ZIP e workflow não correspondem. Substitua os dois pelo par recebido.')
          destination = Path('_sdktools_build')
          destination.mkdir(exist_ok=False)
          with zipfile.ZipFile(source) as archive:
              members = archive.infolist()
              if len(members) > 1000 or sum(m.file_size for m in members) > 32 * 1024 * 1024:
                  raise SystemExit('Fontes excedem o limite.')
              seen = set()
              for member in members:
                  name = member.filename.rstrip('/')
                  parts = name.split('/')
                  key = unicodedata.normalize('NFC', name).casefold()
                  if (member.filename != member.orig_filename or not (name.startswith('SDKtools/') or (name == 'SDKtools' and member.is_dir())) or any(p in ('', '.', '..') for p in parts)
                      or '\\' in name or ':' in name or any(ord(c) < 32 for c in name)
                      or key in seen or stat.S_IFMT(member.external_attr >> 16) not in (0, stat.S_IFREG, stat.S_IFDIR)
                      or member.file_size > 4 * 1024 * 1024 or member.flag_bits & 1):
                      raise SystemExit('Estrutura dos fontes inválida.')
                  seen.add(key)
              for member in members:
                  target = destination.joinpath(*member.filename.rstrip('/').split('/'))
                  if member.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with archive.open(member) as reader, target.open('xb') as writer:
                          content = reader.read(member.file_size + 1)
                          if len(content) != member.file_size:
                              raise SystemExit('Fonte truncado ou excessivo.')
                          writer.write(content)
          root = destination / 'SDKtools'
          validation = json.loads((root / 'Validation/V3_12-validation.json').read_text())
          if validation.get('toolVersion') != '3.12':
              raise SystemExit('Manifesto de outra versão.')
          for relative, expected in validation['sourceSHA256'].items():
              parts = relative.split('/')
              if any(p in ('', '.', '..') for p in parts) or '\\' in relative or ':' in relative:
                  raise SystemExit('Caminho inválido no manifesto.')
              candidate = root.joinpath(*parts)
              if not candidate.is_file() or hashlib.sha256(candidate.read_bytes()).hexdigest() != expected:
                  raise SystemExit('Fonte diverge do manifesto: ' + relative)
          print('Fontes SDKtools conferidos.')
          PY

      - name: Preparar diretório da base
        run: mkdir _sdktools_input

      - name: Baixar base da Release deste repositório
        if: inputs.base_source == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SDKTOOLS_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          gh release download \
            --repo "$GH_REPO" --pattern 'WePlay_US_6.6.2_base.ipa' \
            --dir _sdktools_input -- "$SDKTOOLS_RELEASE_TAG"
          mv _sdktools_input/WePlay_US_6.6.2_base.ipa _sdktools_input/base.ipa

      - name: Baixar base por link HTTPS privado
        if: inputs.base_source == 'secret_url'
        env:
          SDKTOOLS_BASE_IPA_URL: ${{ secrets.SDKTOOLS_BASE_IPA_URL }}
        run: |
          set -euo pipefail
          python3 _sdktools_build/SDKtools/scripts/download_base.py --output _sdktools_input/base.ipa

      - name: Conferir identidade da base antes de compilar
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          info = json.loads(Path('_sdktools_build/SDKtools/config/base_identity.json').read_text())
          base = Path('_sdktools_input/base.ipa')
          if base.stat().st_size != info['ipa_bytes']:
              raise SystemExit('Tamanho da base incorreto. Envie o IPA original extraído do RAR.')
          h = hashlib.sha256()
          with base.open('rb') as stream:
              for block in iter(lambda: stream.read(1024*1024), b''):
                  h.update(block)
          if h.hexdigest() != info['ipa_sha256']:
              raise SystemExit('SHA-256 da base incorreto. Use o IPA original antes de assinar no GBox.')
          print('Identidade da base confirmada.')
          PY

      - name: Testar e compilar framework iPhoneOS
        working-directory: _sdktools_build/SDKtools
        run: |
          set -euo pipefail
          bash scripts/build_framework.sh 2>&1 | tee sdktools-build.log

      - name: Integrar e verificar o IPA
        working-directory: _sdktools_build/SDKtools
        run: |
          set -euo pipefail
          python3 scripts/integrate_ipa.py \
            --ipa ../../_sdktools_input/base.ipa \
            --framework dist/SDKtools.framework \
            --output dist/WePlay_US_6.6.2_SDKtools_v3_12_unsigned.ipa 2>&1 | tee sdktools-package.log
          shasum -a 256 dist/WePlay_US_6.6.2_SDKtools_v3_12_unsigned.ipa > dist/WePlay_US_6.6.2_SDKtools_v3_12_unsigned.ipa.sha256

      - name: Entregar IPA completo para assinatura
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SDKtools-v3.12-US-IPA
          path: |
            _sdktools_build/SDKtools/dist/WePlay_US_6.6.2_SDKtools_v3_12_unsigned.ipa
            _sdktools_build/SDKtools/dist/WePlay_US_6.6.2_SDKtools_v3_12_unsigned.manifest.json
            _sdktools_build/SDKtools/dist/WePlay_US_6.6.2_SDKtools_v3_12_unsigned.ipa.sha256
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Guardar logs e símbolos
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: SDKtools-v3.12-US-diagnostico-build
          path: |
            _sdktools_build/SDKtools/sdktools-build.log
            _sdktools_build/SDKtools/sdktools-package.log
            _sdktools_build/SDKtools/dist/SDKtools.framework.dSYM.zip
          if-no-files-found: ignore
          retention-days: 7

      - name: Orientar download
        run: |
          printf '%s\n' 'Baixe SDKtools-v3.12-US-IPA nos artefatos desta execução. Extraia o ZIP e importe o .ipa no GBox. Assine também os componentes incorporados. Instalação e captura ainda precisam ser confirmadas no iPhone.' >> "$GITHUB_STEP_SUMMARY"
